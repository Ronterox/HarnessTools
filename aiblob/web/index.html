<body>

                     file: 'referenced file', text: 'text file' };
/* non-code files are pages, not blobs: `file` = code references it (pale, tinted by its region), `text` = nothing does (plain white) */

        add: v('--add'), rem: v('--rem'), mix: v('--mix'), err: v('--err'), data: v('--data'), git: v('--git'),

/* <expand> schema v3 / v4 (SCHEMA.md): step 0 and steps marked `full` carry the whole state, the others only what

   previous one with zeroed deltas (one copy, shared by the following steps until it changes), kept in its place;

const cmpStr = (p, q) => p < q ? -1 : p > q ? 1 : 0;

/* </expand> */
/* ───────────────────────── sessions & git steps ─────────────────────────

  const d = b.delta, refs = STEPS[cur].edges.filter(e => e.kind === 'ref' && e.b === b.id);
  return `<b>${esc(b.name)}</b><div class="k">${esc(KIND_LABEL[b.kind])} · ${esc(b.path)}</div><div>${b.size} lines</div>
    <div>${d.added || d.removed ? `<span class="add">+${d.added}</span> <span class="rem">−${d.removed}</span> this step` : '<span class="k">no lines edited this step</span>'}${d.state === 'new' ? ' · <b>new</b>' : ''}</div>
    <div class="k">${b.kind === 'text' ? 'nothing references it' : refs.length ? 'referenced by ' + refs.map(e => esc(IDX[cur].blobs.get(e.a)?.title)).join(', ') : 'no references at this step'}</div>
    <div class="k" style="margin-top:4px">click for details</div>`;
}
const EDGE_SAYS = { main: 'call on the main path', error: 'call from an error branch', data: 'shared data', ref: 'references the file', deferred: 'passed as callback: handed over as a value, called later' };
function blobTip(b) {
  if (PAGE(b.kind)) return fileTip(b);
  const d = b.delta, kinds = {}; for (const e of STEPS[cur].edges) if (e.a === b.id || e.b === b.id) kinds[e.kind] = (kinds[e.kind] || 0) + 1;
  const L = b.label || {}, [lvl, ...why] = String(L.risk || '').split(':'), lv = lvl.trim().toLowerCase();
  const risk = L.risk ? ` <span class="risk risk-${esc(lv)}">${esc(lv)} risk</span>${why.length ? `<div class="k">${esc(why.join(':').trim())}</div>` : ''}` : '';
  return `<b>${esc(b.face)} ${esc(b.title)}</b>${risk}${b.title !== b.name ? `<div class="k">${esc(b.name)}</div>` : ''}
    ${L.summary ? `<div class="sum">${esc(L.summary)}</div>` : ''}<div class="k">${esc(KIND_LABEL[b.kind] || b.kind)} · ${esc(b.region)} · ${esc(b.id)}</div>
    <div>${b.size} lines · complexity ${b.complexity} · ${b.errors} error exits · ${b.funcs.length} funcs</div>
    <div>${d.added || d.removed ? `<span class="add">+${d.added}</span> <span class="rem">−${d.removed}</span> this step` : '<span class="k">no lines edited this step</span>'}${d.moved ? ` · <span class="k">${d.moved} lines moved between blobs</span>` : ''}${d.state === 'new' ? ' · <b>new</b>' : ''}</div>
    <div class="k">${Object.entries(kinds).map(([k, n]) => `${n} ${k}`).join(' · ') || 'no edges'}</div>
    <div>${b.data.slice(0, 8).map(s => `<span class="sym">${esc(s)}</span>`).join('')}</div><div class="k" style="margin-top:4px">click to open</div>`;
}
function onMove(ev) {
  mouse = { x: ev.clientX, y: ev.clientY };
  if (drill) {
    const ch = drill.chips.find(c => mouse.x > c.x0 && mouse.x < c.x1 && mouse.y > c.y0 && mouse.y < c.y1);
    const st = ch ? null : (drill.stains || []).slice().reverse().find(s => Math.hypot(s.x - mouse.x, s.y - mouse.y) < s.r);
    const n = (drill.nodes || []).find(n => Math.hypot(n.x - mouse.x, n.y - mouse.y) < n.r);
    let eh = null, bd = 6;
    if (!ch && !st && !n) for (const g of drill.edges || []) { const d = distToPoly(g.pts, mouse.x, mouse.y); if (d < bd) { bd = d; eh = g; } }
    drill.hov = n ? n.q : null; cv.style.cursor = n || ch ? 'pointer' : 'default';
    if (ch) { const ob = IDX[cur].blobs.get(ch.id);
      showTip(`<b>${esc(ob?.title)}</b><div class="k">${ch.kinds.map(k => k === 'main' ? 'main-path call' : k === 'error' ? 'error-branch call' : k === 'ref' ? 'references the file' : 'shared data').join(' · ')} · ${ob && PAGE(ob.kind) ? 'click for details' : 'click to open'}</div>
      ${ch.via.map(s => `<span class="sym">${esc(s)}</span>`).join('')}`, mouse.x, mouse.y); }
    else if (st) showTip(stainTip(st.m, st.where), mouse.x, mouse.y);
    else if (eh) showTip(`<b>${esc(eh.from ? eh.from.name : eh.other.title)}</b> → <b>${esc(eh.to ? eh.to.name : eh.other.title)}</b><div class="k">${EDGE_SAYS[eh.k]}</div>`, mouse.x, mouse.y);
    else hideTip();
    return;
  }
  hover = blobAt(mouse.x, mouse.y); hoverEdge = null; hoverNode = null;
  if (!hover) { const dn = dnGeo.find(d => Math.hypot(d.x - mouse.x, d.y - mouse.y) < 9); if (dn) hoverNode = dn.g; }
  if (hoverNode) {
    showTip(`<b>shared data</b> <span class="k">· ${hoverNode.ids.length} blobs</span><div>${hoverNode.syms.map(s => `<span class="sym">${esc(s)}</span>`).join('')}</div>
      <div class="k">${hoverNode.ids.map(id => esc(IDX[cur].blobs.get(id)?.title)).join(' · ')}</div>`, mouse.x, mouse.y); cv.style.cursor = 'default'; return;
  }
  if (hover) {
    const b = IDX[cur].blobs.get(hover), st = stainGeo.slice().reverse().find(s => s.id === hover && Math.hypot(s.x - mouse.x, s.y - mouse.y) < s.r);
    cv.style.cursor = 'pointer';
    if (hover === fileCard && !st) { hideTip(); return; }      // its card is already open beside it
    showTip(st ? stainTip(st.m, b.title) : blobTip(b), mouse.x, mouse.y); cv.style.cursor = 'pointer'; return;
  }
  let bd = 6;
  for (const g of edgeGeo) { const d = distToPoly(g.pts, mouse.x, mouse.y); if (d < bd) { bd = d; hoverEdge = g.e; } }
  cv.style.cursor = 'default';
  if (hoverEdge) {
    const e = hoverEdge, A = IDX[cur].blobs.get(e.a), B = IDX[cur].blobs.get(e.b);
    showTip(`<b>${esc(A.title)}</b> ${e.kind === 'data' ? '⟷' : '→'} <b>${esc(B.title)}</b><div class="k">${EDGE_SAYS[e.kind] || e.kind} · n=${e.n}</div>
      ${(e.via || []).map(s => `<span class="sym">${esc(s)}</span>`).join('')}`, mouse.x, mouse.y);
  } else hideTip();
}
function onClick(ev) {
  const x = ev.clientX, y = ev.clientY;
  if (drill) {
    const ch = drill.chips.find(c => x > c.x0 && x < c.x1 && y > c.y0 && y < c.y1);
    if (ch) {
      const ob = IDX[cur].blobs.get(ch.id);
      if (ob && PAGE(ob.kind)) { drill.sel = null; showFileCard(ch.id, { x: (ch.x0 + ch.x1) / 2, y: ch.y1 }); } else openDrill(ch.id);
      return;
    }
    const n = (drill.nodes || []).find(n => Math.hypot(n.x - x, n.y - y) < n.r);
    if (n) { drill.sel = drill.sel === n.q ? null : n.q; drill.sel ? showCard(n) : hideCard(); return; }
    if (fileCard) { hideCard(); return; }
    const { C, RR } = drillGeo();
    if (Math.hypot(x - C.x, y - C.y) > RR * 1.05) closeDrill(); else { drill.sel = null; hideCard(); }
    return;
  }
  const id = blobAt(x, y); if (id) openDrill(id); else hideCard();
}
cv.addEventListener('mousemove', onMove);
cv.addEventListener('mouseleave', () => { hover = null; hoverEdge = null; hoverNode = null; hideTip(); });
cv.addEventListener('click', onClick);
let scrubbing = false;
tl.addEventListener('pointerdown', e => { scrubbing = true; tl.setPointerCapture(e.pointerId); setPlaying(false); setStep(tickAt(e.offsetX)); });
tl.addEventListener('pointermove', e => {
  if (scrubbing) setStep(tickAt(e.offsetX));
  const s = STEPS[tickAt(e.offsetX)]; if (!s) return;
  const g = isGit(s), who = MULTI ? `<div class="k" style="${g ? 'color:var(--git)' : ''}">${g ? 'git commit, not AI work' : esc(whoText(s))}${s.applied === false ? ' · <span class="warn">⚠ not applied</span>' : ''}</div>` : '';
  showTip(`<span class="k">step ${s.idx + 1} · turn ${s.turn}</span><div><b>${esc(s.tool)}</b> ${esc(s.file)} <span class="add">+${s.added}</span> <span class="rem">−${s.removed}</span></div>${who}<div class="k">${esc((s.said || '').slice(0, 120))}</div>`, e.clientX, e.clientY - (MULTI ? 106 : 90));
});
tl.addEventListener('pointerup', () => { scrubbing = false; });
tl.addEventListener('pointerleave', hideTip);
$('#play').onclick = togglePlay;
$('#prev').onclick = () => { setPlaying(false); setStep(cur - 1); };
$('#next').onclick = () => { setPlaying(false); setStep(cur + 1); };
$('#speed').onchange = e => { speed = +e.target.value; };
$('#legendBtn').onclick = () => { const on = $('#legend').classList.toggle('on'); $('#legendBtn').setAttribute('aria-expanded', on); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') { if (drill) closeDrill(); else if (fileCard) hideCard(); else $('#legend').classList.remove('on'); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') { setPlaying(false); setStep(cur - 1); }
  else if (e.key === 'ArrowRight') { setPlaying(false); setStep(cur + 1); }
  else if (e.key === 'Home') setStep(0);
  else if (e.key === 'End') setStep(STEPS.length - 1);
  else if (e.key === 'l' || e.key === 'L') $('#legendBtn').click();
  else if (!e.ctrlKey && !e.metaKey && !e.altKey && SESS_ON && 'gGsS'.includes(e.key) && e.key.length === 1) {
    const list = e.key === 'g' || e.key === 'G' ? GITS : BOUNDS, to = e.key === e.key.toLowerCase() ? list.find(i => i > cur) : [...list].reverse().find(i => i < cur);
    if (to != null) { setPlaying(false); setStep(to); }
  }
});
$('#sess').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setPlaying(false); setStep(+b.dataset.i); } });
addEventListener('resize', resize);
lightQ.addEventListener('change', readTheme);

function buildLegend() {
  const sw = k => { const c = kindColors(k, 'templates');
    return `<span class="sw${PAGE(k) ? ' pg' : ''}" style="background:${c.fill};border-color:${c.stroke}${k === 'orphan' ? ';border-style:dashed' : ''}"></span>`; };
  const kinds = Object.keys(KIND_LABEL).map(k => `<div class="row">${sw(k)}${KIND_LABEL[k]}</div>`).join('');
  const line = (dash, col, w) => `<svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${dash}"/></svg>`;
  const stain = c => `<span class="dot" style="background:radial-gradient(circle, ${c}2E 0 30%, ${c}A6 66%, transparent 70%);box-shadow:inset 0 0 0 1.5px ${c}"></span>`;
  $('#legend').innerHTML = `<h4>blobs · area = lines, border = complexity</h4><div class="grid">${kinds}</div>
    <h4>lines · width = count</h4>
    <div class="row">${line('', `rgb(${T.main})`, 2)} call on the main path</div>
    <div class="row">${line('7 5', T.err, 2)} call from an error branch</div>
    <div class="row">${line('0.5 4', T.data, 1.6)} shared data (hover: symbols)</div>
    <div class="row"><span class="dot" style="background:${T.data};width:9px;height:9px;margin:0 12px 0 13px"></span>data shared by &gt;3 blobs (spokes)</div>
    <div class="row">${line('', T.mute, 1.1)} code names a file (hover: literal)</div>
    <div class="row">${line('9 4 0.5 4', `rgb(${T.main})`, 1.6)} passed as callback (drill-down)</div>
    <h4>stains · size = change ÷ size, settle over ${STAIN_SETTLE} steps</h4>
    <div class="grid"><div class="row">${stain(T.mix)} modified</div><div class="row">${stain(T.rem)} mostly deleted</div>
    <div class="row"><span class="dot" style="border:2px solid ${T.flash}"></span> new blob</div>
    <div class="row"><span class="dot" style="border:1.5px dashed ${T.mute}"></span> code moved in</div>
    ${SESS_ON ? `<div class="row">${stain(T.git)} changed by a git commit</div>` : ''}</div>
    <div class="keys">pure additions leave no stain: the blob grows instead<br>click blob → functions · click page → file card<br>space play · ← → step · esc back · L legend${SESS_ON ? '<br>g / G next / previous git step · s / S next / previous session' : ''}</div>`;
}

/* ───────────────────────── loop & boot ───────────────────────── */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (playing) { acc += dt * 1000 * speed; if (acc > 1100) { acc = 0; if (cur >= STEPS.length - 1) setPlaying(false); else setStep(cur + 1); } }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = T.bg; ctx.fillRect(0, 0, VW, VH);
  if (STEPS.length) {
    updateVis(dt); if (!drill) moveCamera(dt); const t = now / 1000;
    drawMap(now, t);
    if (drill) drawDrill(now, t);
    else if (fileCard && !fileAt) placeFileCard();
    drawTimeline();
  }
  requestAnimationFrame(frame);
}
(async () => {
  readTheme(); setPlaying(false); resize(); requestAnimationFrame(frame);
  try {
    const data = await load();
    normalize(data);
    if (!STEPS.length) throw new Error(`${SRC} has no steps`);
    buildLegend(); buildSessions(); layout(); resize();
    const qs = new URLSearchParams(location.search);
    $('#src').textContent = SRC; $('#src').classList.toggle('sample', SRC.startsWith('sample'));
    $('#meta').textContent = `${data.session || ''} · ${data.root || ''} · ${STEPS.length} steps · ${U.size} blobs over the session`;
    tl.setAttribute('aria-valuemax', STEPS.length - 1);
    $('#empty').remove();
    setStep(qs.has('step') ? +qs.get('step') : STEPS.length - 1); VIEW = camTarget();
    if (qs.has('drill')) openDrill(qs.get('drill'));
  } catch (e) {
    $('#empty').textContent = String(e.message || e); $('#meta').textContent = 'no data';
    console.error(e);
  }
})();
</script>
</body>
</html>
