<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiblob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0E13; --panel: #0F151C; --line: #1D2731; --ink: #D7DEE7; --mute: #7A8797; --faint: #3A4654;
  --add: #34D27B; --rem: #FF4D5E; --mix: #FFB21E; --err: #FF7043; --data: #7FA9E0; --git: #8B96A5;
  --sans: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #F2F4F6; --panel: #FFFFFF; --line: #D6DDE4; --ink: #17202A; --mute: #5B6878; --faint: #B4BEC9;
          --add: #16A35A; --rem: #E5293C; --mix: #D98E00; --err: #E2531F; --data: #3E6FB0; --git: #6F7B8A; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.35 var(--sans); }
#map { position: fixed; inset: 0; display: block; }
button, select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
button:hover, select:hover { border-color: var(--mute); }
button:focus-visible, select:focus-visible, #tl:focus-visible { outline: 2px solid var(--mix); outline-offset: 2px; }
#top { position: fixed; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
       border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(6px); z-index: 3; }
.mark { font-weight: 700; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 7px; }
.mark i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.meta { color: var(--mute); font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.badge { font: 11px var(--mono); padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
.badge.sample { color: var(--mix); border-color: color-mix(in srgb, var(--mix) 50%, transparent); }
#top button { padding: 4px 12px; font-weight: 600; letter-spacing: .03em; }
#top button.tog { display: flex; align-items: center; gap: 7px; }
#top button.tog .k { font: 11px var(--mono); color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
#top button.tog[aria-pressed="true"] { border-color: color-mix(in srgb, var(--mix) 60%, transparent); color: var(--mix); }
#crumbs { display: none; align-items: center; gap: 2px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 15px; font-weight: 600; }
body.areas #crumbs { display: flex; }
body.areas .meta { flex: 0 1 auto; max-width: 30%; }
#crumbs button { border: 0; padding: 2px 6px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; max-width: 28ch; }
#crumbs button:hover { color: var(--ink); background: var(--line); }
#crumbs button[aria-current] { color: var(--ink); cursor: default; background: none; }
#crumbs .sep { color: var(--faint); }
@media (max-width: 720px) { .meta, #src { display: none; } #top button.tog .k { display: none; } }
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 118px; background: var(--panel); border-top: 1px solid var(--line);
       z-index: 3; display: grid; grid-template-rows: auto 1fr; padding: 8px 16px 10px; gap: 6px; }
#status { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: baseline; min-width: 0; }
#status .l1 { display: flex; gap: 10px; align-items: baseline; font: 12px var(--mono); white-space: nowrap; }
.tool { padding: 1px 7px; border-radius: 4px; background: var(--line); color: var(--ink); font-weight: 500; }
.file { color: var(--ink); } .add { color: var(--add); } .rem { color: var(--rem); } .dim { color: var(--mute); }
#said { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#said.dim { color: var(--mute); font-weight: 400; }
#said.git { color: var(--git); font-weight: 400; }
.tool.git { background: color-mix(in srgb, var(--git) 22%, var(--line)); color: var(--git); }
.who { display: inline-block; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; color: var(--mute); }
.who i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.warn { color: var(--mix); cursor: help; }
#sess { display: none; align-items: center; gap: 2px; min-width: 0; overflow: hidden; white-space: nowrap; font: 11px var(--mono); color: var(--mute); }
#sess .lab { margin-right: 6px; text-transform: uppercase; letter-spacing: .1em; }
#sess button { width: auto; height: 20px; padding: 0 7px; border: 0; border-radius: 4px; font: inherit; color: var(--mute); display: inline-flex; align-items: center; gap: 6px; }
#sess button:hover { color: var(--ink); background: var(--line); }
#sess button.on { color: var(--ink); background: var(--line); }
#sess button i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#sess button i.gt { width: 2px; height: 11px; border-radius: 0; background: var(--git); }
#sess button b { font-weight: 500; opacity: .7; }
body.multi #bar { height: 138px; grid-template-rows: auto auto 1fr; }
body.multi #sess { display: flex; }
body.multi #empty { inset: 46px 0 138px; }
#controls { display: grid; grid-template-columns: auto auto auto auto 1fr; gap: 8px; align-items: center; min-width: 0; }
#controls button { width: 34px; height: 30px; display: grid; place-items: center; padding: 0; }
#controls select { height: 30px; padding: 0 6px; background: var(--panel); }
#count { font: 12px var(--mono); color: var(--mute); min-width: 64px; text-align: right; }
#tl { width: 100%; height: 48px; display: block; cursor: pointer; }
#tip { position: fixed; z-index: 6; pointer-events: none; max-width: 340px; padding: 8px 10px; border-radius: 8px; display: none;
       background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 14px; }
#tip b { font-weight: 700; } #tip .sum { margin: 3px 0; }
.risk { font: 10px var(--mono); padding: 0 5px; margin-left: 6px; border-radius: 4px; border: 1px solid var(--mute); color: var(--mute); }
.risk-high { color: var(--rem); border-color: var(--rem); } .risk-medium { color: var(--mix); border-color: var(--mix); } #tip .k { font: 11px var(--mono); color: var(--mute); }
#tip .sym, #card .sym { display: inline-block; font: 11px var(--mono); padding: 0 5px; margin: 2px 3px 0 0; border-radius: 4px; border: 1px dotted var(--data); color: var(--data); }
#card { position: fixed; z-index: 5; width: 340px; padding: 12px 14px; border-radius: 10px; display: none;
        background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 40px rgba(0,0,0,.4); }
#card h3 { margin: 0 0 2px; font-size: 19px; } #card .loc { font: 12px var(--mono); color: var(--mute); }
#card .fk { margin: 9px 0 2px; font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
#card .sum { margin: 3px 0 0; font-size: 14px; }
#card pre { margin: 10px 0 8px; padding: 8px 10px; border-radius: 6px; background: var(--bg); border-left: 3px solid var(--mix);
            font: 12px/1.55 var(--mono); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#clsearch { position: fixed; top: 56px; right: 16px; z-index: 4; }
#clq { width: 220px; height: 30px; padding: 0 10px 0 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 13px var(--mono); }
#clq:focus-visible { outline: 2px solid var(--mix); outline-offset: 2px; }
#clsearch::before { content: '⌕'; position: absolute; left: 9px; top: 4px; color: var(--mute); font-size: 16px; }
#clsugg { position: absolute; top: 34px; right: 0; display: none; flex-direction: column; gap: 3px; min-width: 220px; }
#clsugg.on { display: flex; }
#clsugg button { text-align: left; padding: 3px 9px; font: 12px var(--mono); background: var(--panel); border-radius: 99px; display: flex; gap: 8px; align-items: center; }
#clsugg button.on { border-color: var(--mix); color: var(--mix); }
#clsugg button i { font-style: normal; width: 9px; height: 9px; border-radius: 50%; flex: none; }
#legend { position: fixed; top: 56px; right: 16px; z-index: 4; width: 300px; padding: 12px 14px; border-radius: 10px; display: none;
          background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--line); font-size: 14px; }
#legend.on { display: block; }
#legend h4 { margin: 8px 0 4px; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
#legend h4:first-child { margin-top: 0; }
#legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
#legend .sw { width: 18px; height: 14px; border-radius: 7px; border: 2px solid; flex: none; }
#legend .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
#legend .sw.pg { width: 13px; height: 16px; border-radius: 2px; border-width: 1.5px; margin: 0 2.5px; }
#legend .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
#legend .keys { font: 11px var(--mono); color: var(--mute); margin-top: 8px; line-height: 1.6; }
#empty { position: fixed; inset: 46px 0 118px; display: grid; place-items: center; color: var(--mute); font: 13px var(--mono); pointer-events: none; }
/* live mode (liveserve.py): a LIVE badge, Re-layout, the "+N new" pill; provisional steps are drawn faded */
[hidden] { display: none !important; }
.badge.live { color: var(--add); border-color: color-mix(in srgb, var(--add) 50%, transparent); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; letter-spacing: .08em; }
.badge.live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: beat 1.6s ease-in-out infinite; }
.badge.live.off { color: var(--mute); border-color: var(--line); } .badge.live.off i { animation: none; opacity: .5; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
#newPill { position: fixed; right: 16px; bottom: 128px; z-index: 4; padding: 4px 12px; border-radius: 99px; font-weight: 600; letter-spacing: .03em;
           color: var(--add); border-color: color-mix(in srgb, var(--add) 55%, transparent); background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: 0 6px 18px rgba(0,0,0,.3); }
body.multi #newPill { bottom: 148px; }
.prov { color: var(--mute); font-style: italic; }
/* the labelling chip (live, liveserve.py's worker): a coloured dot + a tag, the count of blobs waiting, the GPU */
.badge.ask { display: inline-flex; align-items: center; gap: 5px; --c: var(--mute); color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.badge.ask i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ask b { font-weight: 600; } .badge.ask .t { opacity: .75; }
.badge.ask.asking { --c: var(--add); } .badge.ask.asking i { animation: beat .8s ease-in-out infinite; }
.badge.ask.waiting, .badge.ask.starting { --c: var(--mix); } .badge.ask.starting i { animation: beat 1.6s ease-in-out infinite; }
.badge.ask.paused, .badge.ask.down, .badge.ask.error { --c: var(--rem); } .badge.ask.down i { background: none; border: 1.5px solid currentColor; width: 5px; height: 5px; }
/* diffs inside blobs: the look and scope switches, the panel beside the drill-down, the code rows, the lens (a whole
   function) and the bubble (a hunk) */
#top .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
#top .seg button { border: 0; border-radius: 6px; padding: 3px 10px; font-weight: 600; letter-spacing: .02em; color: var(--mute); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
#top .seg button:hover { color: var(--ink); background: var(--line); }
#top .seg button[aria-pressed="true"], #top .seg button[aria-selected="true"] { color: var(--bg); background: var(--mix); }
#top .seg button .k { font: 10px var(--mono); opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; }
#top .seg .lab { font: 10px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: .1em; padding: 0 6px 0 4px; align-self: center; }
@media (max-width: 1280px) { #top .seg button .k, #top .seg .lab { display: none; } }
.mix { color: var(--mix); }
#dbar { position: fixed; left: 14px; top: 170px; width: 340px; z-index: 2; display: flex; flex-direction: column; gap: 6px; font: 12px var(--mono); color: var(--mute);
        padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 86%, transparent); }
#dfile .fk { margin: 6px 0 1px; font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; } #dfile .sum { font: 13px var(--sans); color: var(--ink); }
#dfile .sym { display: inline-block; font: 11px var(--mono); padding: 0 5px; margin: 2px 3px 0 0; border-radius: 4px; border: 1px dotted var(--data); color: var(--data); }
#dsum .l1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.02em; }
#dbar .bar { display: inline-flex; width: 52px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); vertical-align: middle; margin-right: 6px; }
#dbar .k { font-size: 11px; margin-top: 3px; } #dsum b { font-weight: 600; } #dnote { font-style: italic; }
#dbar { pointer-events: none; } #dstrip { pointer-events: auto; width: 100%; height: 46px; display: block; cursor: pointer; border-radius: 6px; }      /* (the map under the panel keeps its clicks) */
#dstrip:focus-visible { outline: 2px solid var(--mix); outline-offset: 2px; }
#dleg { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; } #dleg span { display: inline-flex; align-items: center; gap: 6px; }
#tip:has(.code) { max-width: 430px; }
.code { font: 11.5px/1.6 var(--mono); margin-top: 6px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.code .r { display: grid; grid-template-columns: 34px 14px 1fr; white-space: pre; border-left: 3px solid transparent; }
.code .r i { font-style: normal; color: var(--faint); text-align: right; padding-right: 6px; user-select: none; }
.code .r s { text-decoration: none; color: var(--faint); user-select: none; }
.code .r code { font: inherit; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.code .r.p { background: color-mix(in srgb, var(--add) 13%, transparent); border-left-color: var(--add); } .code .r.p s { color: var(--add); }
.code .r.m { background: color-mix(in srgb, var(--rem) 13%, transparent); border-left-color: var(--rem); } .code .r.m s { color: var(--rem); } .code .r.m code { color: color-mix(in srgb, var(--ink) 80%, var(--rem)); }
.code .gap { padding: 1px 0 1px 51px; color: var(--mute); font-size: 10.5px; background: color-mix(in srgb, var(--line) 45%, transparent); letter-spacing: .04em; }
.code .more { padding: 2px 0 2px 51px; color: var(--mute); font-size: 10.5px; }
.code.sbs .row2 { display: grid; grid-template-columns: 1fr 1fr; } .code.sbs .row2 > .r { min-width: 0; }
.code.sbs .row2 > .r.e { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--line) 60%, transparent) 5px 6px); }
.code.sbs .row2 > .r + .r { box-shadow: inset 1px 0 0 var(--line); }
.code.sbs .heads { display: grid; grid-template-columns: 1fr 1fr; font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--mute); padding: 4px 0; }
.code.sbs .heads span { padding-left: 51px; }
#dlens { position: fixed; z-index: 5; display: none; padding: 12px 14px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
         box-shadow: 0 18px 50px rgba(0,0,0,.5); flex-direction: column; opacity: 0; transform: translateX(14px); transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.2); }
#dlens.on { opacity: 1; transform: none; }
#dlens h3 { margin: 0; font-size: 20px; display: flex; align-items: baseline; gap: 10px; }
#dlens h3 .x { margin-left: auto; font: 12px var(--mono); padding: 2px 8px; color: var(--mute); }
#dlens .loc { font: 12px var(--mono); color: var(--mute); margin-top: 2px; }
#dlens .scroll { overflow: auto; min-height: 0; flex: 1; margin-top: 4px; border-radius: 6px; } #dlens .code { margin-top: 4px; }
#dlens .bar { height: 6px; border-radius: 3px; display: flex; overflow: hidden; margin-top: 8px; background: var(--line); }
#dbloom { position: fixed; z-index: 5; display: none; width: 380px; padding: 9px 11px 8px; border-radius: 22px; background: var(--panel);
          border: 1.5px solid var(--mix); box-shadow: 0 14px 40px rgba(0,0,0,.5); opacity: 0; transform: scale(.12); transition: transform .42s cubic-bezier(.2,1.5,.35,1), opacity .18s; }
#dbloom.on { opacity: 1; transform: none; }
#dbloom .hd { font: 12px var(--mono); color: var(--mute); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; } #dbloom .hd b { font: 600 15px var(--sans); color: var(--ink); }
#dbloom .code { max-height: 300px; overflow: auto; }
</style>
</head>
<body>
<canvas id="map" role="img" aria-label="Application map: blobs are entry points and shared hubs, lines are calls and shared data"></canvas>
<header id="top">
  <div class="mark"><span>aiblob</span><i style="background:var(--add)"></i><i style="background:var(--mix)"></i><i style="background:var(--rem)"></i></div>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="meta" id="meta">loading…</div>
  <span class="badge" id="src"></span>
  <span class="badge live" id="liveBadge" hidden title="live: steps are added as the session is written"><i></i>LIVE</span>
  <span class="badge ask" id="askChip" hidden role="status" aria-live="polite"></span>
  <button id="relayoutBtn" hidden title="Lay the map out again over every blob so far (live, new blobs are placed beside the others and nothing moves)">Re-layout</button>
  <div class="seg" id="dlook" role="tablist" aria-label="Diff look" hidden>
    <button role="tab" data-v="A" aria-selected="true" title="Skins: a hair per added line (5 make a thick one), a bite per hunk of removed lines (1)">Skins <span class="k">1</span></button>
    <button role="tab" data-v="B" aria-selected="false" title="Twins: the old version as a dashed ghost overlapping the new one (2)">Twins <span class="k">2</span></button>
  </div>
  <div class="seg" id="dscope" role="radiogroup" aria-label="Diff scope" hidden>
    <span class="lab">since</span>
    <button data-s="step" aria-pressed="true" title="what this step changed (7)">this step <span class="k">7</span></button>
    <button data-s="session" aria-pressed="false" title="everything since the session started, up to this step (8)">session start <span class="k">8</span></button>
    <button data-s="since" aria-pressed="false" title="since you looked: pick the step on the strip (9, then ←/→)">you looked <span class="k">9</span></button>
  </div>
  <button id="areasBtn" class="tog" aria-pressed="false" title="Areas: groups of blobs, one level above the blob map (A)">Areas <span class="k">A</span></button>
  <button id="followBtn" class="tog" aria-pressed="false" title="Follow: each step flies the camera to what it edits (F)">Follow <span class="k">F</span></button>
  <button id="legendBtn" aria-expanded="false" aria-controls="legend">Legend</button>
</header>
<aside id="legend" aria-label="Legend"></aside>
<div id="empty">loading timeline…</div>
<div id="tip" role="tooltip"></div>
<div id="clsearch" hidden><input id="clq" type="search" placeholder="find a function  /" aria-label="Find a function in this blob" autocomplete="off"><div id="clsugg"></div></div>
<div id="card" role="dialog" aria-label="Function detail"></div>
<div id="dbar" hidden aria-label="What changed in this blob"><div id="dfile" hidden></div><div id="dnote"></div><div id="dsum"></div><canvas id="dstrip" tabindex="0" role="slider" aria-label="Diff since step: left / right arrows move the eye"></canvas><div id="dleg"></div></div>
<div id="dlens" role="dialog" aria-label="Function diff"></div>
<div id="dbloom" role="dialog" aria-label="Hunk"></div>
<button id="newPill" hidden aria-live="polite" title="new steps since you left the end: jump to the newest"></button>
<footer id="bar">
  <div id="status" aria-live="polite"><div class="l1" id="l1"></div><div id="said"></div></div>
  <div id="sess" aria-label="Sessions"></div>
  <div id="controls">
    <button id="prev" aria-label="Previous step"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2v10M12 2 5 7l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button id="play" aria-label="Play"></button>
    <button id="next" aria-label="Next step"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2v10M2 2l7 5-7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
    <canvas id="tl" tabindex="0" role="slider" aria-label="Timeline step" aria-valuemin="0"></canvas>
  </div>
</footer>
<script>
'use strict';
/* ───────────────────────── utilities ───────────────────────── */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, RECENCY = 6, TOP = 46;
let BOTTOM = 118;

  const what = { idle: 'labels: nothing to ask', waiting: `labels: ${n} new blob${n === 1 ? '' : 's'} waiting for a quiet moment`,
    asking: `labels: asking the model (${n} waiting)`, starting: 'labels: starting the local model', paused: `labels: paused, GPU at ${temp} (resumes when it cools)`,
    down: `labels: the model is not reachable (retrying${a.why === 'nomem' || a.why === 'vram' ? ': not enough free GPU memory' : ''}); fallback names meanwhile`,
    error: `labels: ${a.error || 'error'}; fallback names meanwhile` }[st] || st;
  c.className = `badge ask ${st}`; c.hidden = false;
  c.title = `${what}${a.server ? ` · server: ${a.server}` : ''}${temp && st !== 'paused' ? ` · GPU ${temp}` : ''}`;
  c.innerHTML = `<i></i>${st === 'paused' ? '🌡' : st === 'down' ? '⏻' : st === 'error' ? '⚠' : '🏷'}${n || st === 'asking' ? `<b>${n}</b>` : ''}${temp ? `<span class="t">${temp}</span>` : ''}`;
}
function liveFocus() {
  if (focusT || cur === focusSent) return;
  focusT = setTimeout(() => {
    focusT = null; if (cur === focusSent) return; focusSent = cur;
    fetch('live/focus', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ step: cur }) }).catch(() => {});
  }, 300);
}
/* committed steps after the NCOMMIT ones, then the whole tail after them (`had`: everything was reloaded, the page
   had that many steps before) */
function liveApply(committed, tail, had) {
  const fresh = had !== undefined, was = fresh ? had : STEPS.length, wasN = NCOMMIT, oldTail = LTAIL;
  const srcAt = cur >= wasN && cur - wasN < committed.length ? JSON.stringify(committed[cur - wasN]) : undefined;
  LTAIL = tail.map(t => JSON.stringify(t));
  STEPS.length = IDX.length = NCOMMIT;
  for (const k of [...FACE_R.keys()]) if (k >= NCOMMIT) FACE_R.delete(k);
  for (const [k, r] of DV.ranges) if (r.b >= wasN || !r.ok) DV.ranges.delete(k);     // (diffs: a range over the tail, made again)
  DV.strips.clear();
  for (const raw of committed) liveStep(LEXP, LSTAIN, LSESS, raw, false, LKS);
  NCOMMIT = STEPS.length;
  const ex = LEXP.fork(), stains = new Map(LSTAIN), ss = sessFork(LSESS), ks = lkFork(LKS);
  for (const raw of tail) liveStep(ex, stains, ss, raw, true, ks);
  useSessions(ss);
  if (!BOOTED) {
    if (STEPS.length) { boot(LHEAD); TRACK = cur === STEPS.length - 1; liveMeta(); }
    else { $('#empty').textContent = 'live: waiting for the first step…'; $('#meta').textContent = `${LHEAD.session || ''} · ${LHEAD.root || ''} · live, no steps yet`; }
    return;
  }
  layoutAdd(fresh ? 0 : wasN); areasAdd(fresh ? 0 : wasN);
  VIEW0 = frameOf([...U.values()], 2.2);
  buildSessions(); liveMeta();
  // the viewer's step: clamped when the tail got shorter, shown again when it was provisional and changed
  const last = STEPS.length - 1;
  if (cur > last) liveShow(last, true);
  else if (fresh) liveShow(cur, false);
  else if (cur >= wasN) {
    const now = srcAt !== undefined ? srcAt : LTAIL[cur - NCOMMIT];
    liveShow(cur, now !== oldTail[cur - wasN]);
  }
  if (TRACK) { if (last - cur > 20) liveShow(last, true); }
  else if (STEPS.length > was) NEWN += STEPS.length - was;
  livePill();
}
/* setStep(i) again for a step whose content changed (flash: it plays its arrival again) without leaving TRACK */
function liveShow(i, flash) {
  const keep = stepAt; stepAt = 0; AUTO = true; setStep(i, !flash); AUTO = false;
  if (!flash) stepAt = keep;
}
function autoStep(i) { AUTO = true; setStep(i); AUTO = false; }
function liveTick(dt) {
  FADE += ((STEPS[cur]?.prov ? 1 : 0) - FADE) * (1 - Math.exp(-dt * 6)); if (FADE < 0.005) FADE = 0;
  if (TRACK && BOOTED && cur < STEPS.length - 1) {
    autoAcc += dt * 1000;
    if (autoAcc > 1100 / 4) { autoAcc = 0; autoStep(cur + 1); }    // (more than 20 behind: liveApply jumped)
  } else autoAcc = 0;
}
function livePill() {
  const p = $('#newPill'); if (!p) return;
  p.hidden = !(LIVE && BOOTED && !TRACK && NEWN > 0);
  p.textContent = `+${NEWN} new`;
}
function liveMeta() {
  const tail = STEPS.length - NCOMMIT;
  $('#meta').textContent = `${LHEAD.session || ''} · ${LHEAD.root || ''} · ${NCOMMIT} steps${tail ? ` + ${tail} provisional` : ''} · ${U.size} blobs over the session`;
  $('#src').hidden = true; $('#liveBadge').hidden = false; $('#relayoutBtn').hidden = false;
  tl.setAttribute('aria-valuemax', STEPS.length - 1);
}
function liveBadge(on) {
  const b = $('#liveBadge'); b.classList.toggle('off', !on); b.hidden = false;
  b.title = on ? `live: ${NCOMMIT} steps committed, ${STEPS.length - NCOMMIT} provisional` : 'live: no connection to the server (it retries)';
}
function liveConnect() {
  if (ES) ES.close();
  const es = ES = new EventSource(`live/events?epoch=${EPOCH}&from=${NCOMMIT}&lv=${LV}`);
  const ours = d => { if (d.epoch === EPOCH) return true; liveReload(); return false; };
  es.addEventListener('steps', e => {
    const d = JSON.parse(e.data); if (!ours(d)) return;
    const skip = NCOMMIT - d.from;
    if (skip < 0) { liveReload(); return; }               // a gap: never expected, but never drawn wrong either
    liveApply(d.steps.slice(skip), d.tail);
  });
  es.addEventListener('tail', e => { const d = JSON.parse(e.data); if (ours(d) && d.base === NCOMMIT) liveApply([], d.tail); });
  es.addEventListener('rebuild', () => liveReload());
  es.addEventListener('labels', e => { const d = JSON.parse(e.data); if (!ours(d)) return; LV = d.lv; liveLabels(d.labels); });
  es.addEventListener('ask', e => liveAsk(JSON.parse(e.data)));
  es.onopen = () => liveBadge(true);
  es.onerror = () => liveBadge(false);
}
async function liveReload() {
  if (reloading) { reloading.again = true; return; }
  reloading = { again: true };
  if (ES) { ES.close(); ES = null; }
  try {
    while (reloading.again) {
      reloading.again = false;
      const r = await fetch('live/timeline.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(`live/timeline.json: ${r.status}`);
      liveStart(await r.json());
    }
  } catch (e) { console.error(e); liveBadge(false); }
  reloading = null;
  liveConnect();
}

/* ───────────────────────── loop & boot ───────────────────────── */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (playing) { acc += dt * 1000 * speed; if (acc > 1100) { acc = 0; if (cur >= STEPS.length - 1) { if (!LIVE) setPlaying(false); } else if (!(LIVE && TRACK)) setStep(cur + 1); } }
  if (LIVE) liveTick(dt);
  if (PULSES.size || FPULSES.size) prunePulses(now);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = T.bg; ctx.fillRect(0, 0, VW, VH);
  if (STEPS.length) {
    updateVis(dt); if (!drill) moveCamera(dt); const t = now / 1000;
    drawMap(now, t);
    if (drill) drawDrill(now, t);
    else if (fileCard && !fileAt) placeFileCard();
    clSearchShow(); diffUi(dt);
    if (FADE > 0.01) { ctx.save(); ctx.globalAlpha = 0.5 * FADE; ctx.fillStyle = T.bg; ctx.fillRect(0, 0, VW, VH); ctx.restore(); }   // a provisional step
    drawTimeline();
  }
  requestAnimationFrame(frame);
}
/* the map once there are steps (live mode: maybe later, when the first ones come) */
function boot(data) {
  BOOTED = true;
  buildLegend(); buildSessions(); layout(); layoutAreas(); resize();
  const qs = new URLSearchParams(location.search);
  APP_NAME = String(data.root || '').replace(/\/+$/, '').split('/').pop() || 'app';
  if (!AU.size) { $('#areasBtn').disabled = true; $('#areasBtn').title = 'this timeline has no areas (schema v5, timeline.py)'; }
  // areas: remembered per browser (?areas=1 / 0 overrides for this visit); follow: off unless ?follow=1
  setAreas(qs.has('areas') ? qs.get('areas') === '1' : store.get('aiblob.areas') === '1', qs.has('areas'));
  setFollow(qs.get('follow') === '1');
  AMIX = AREAS_ON ? 1 : 0;
  $('#src').textContent = SRC; $('#src').classList.toggle('sample', SRC.startsWith('sample'));
  $('#meta').textContent = `${data.session || ''} · ${data.root || ''} · ${STEPS.length} steps · ${U.size} blobs over the session`;
  tl.setAttribute('aria-valuemax', STEPS.length - 1);
  $('#empty').remove();
  setStep(qs.has('step') ? +qs.get('step') : STEPS.length - 1);
  if (AREAS_ON && qs.has('area') && AU.has(qs.get('area'))) openA = qs.get('area');
  for (const [id, v] of VIS) { const h = homeOf(id, v.blob); v.x = h.x; v.y = h.y; }
  VIEW = AREAS_ON ? areaCam() : camTarget(); CAM = null; crumbs();
  diffInit().then(() => { if (qs.has('drill') && !drill) openDrill(qs.get('drill')); });
  if (qs.has('drill')) openDrill(qs.get('drill'));
}
(async () => {
  readTheme(); setPlaying(false); resize(); requestAnimationFrame(frame);
  try {
    const data = await load();
    if (LIVE) { liveStart(data); liveConnect(); return; }
    normalize(data);
    if (!STEPS.length) throw new Error(`${SRC} has no steps`);
    boot(data);
  } catch (e) {
    $('#empty').textContent = String(e.message || e); $('#meta').textContent = 'no data';
    console.error(e);
  }
})();
</script>
